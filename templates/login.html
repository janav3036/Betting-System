{% extends 'base.html' %}
{% block content %}

<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh;">
    <form class="auth-form" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h2 style="margin:0 0 20px 0;">Login</h2>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top:12px; font-size:0.9rem; color:#9a8c78;">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
</div>

{% endblock %}
