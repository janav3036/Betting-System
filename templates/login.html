{% extends 'base.html' %}
{% block content %}

<h2 style="margin-top: 0;">Login</h2>
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh;">
    <form class="auth-form" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {%if error%}
        <div style="margin-bottom: 15px; color: red;">
            {{error}}
        </div>
        {%endif%}
        <div style="margin-bottom: 15px;">
            <label><strong>Username</strong></label>
            <input type="text" name="username" placeholder="Enter username" required style="width: 300px; padding: 6px;">

        </div>
        <div style="margin-bottom: 15px;">
            <label><strong>Password</strong></label>
            <input type="password" name="password" placeholder="Enter password" required style="width: 300px; padding: 6px;">

        </div>    
        <button type="submit">Login</button>  
    </form>
    <div style="margin-top: 15px;">
        Don't have an account? 
        <a href="{{url_for('auth.register')}}">Register</a>
    </div>
</div>
{% endblock %}
