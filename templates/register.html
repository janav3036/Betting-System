{% extends 'base.html' %}
{% block content %}

<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh;">
    <form class="auth-form" method="POST">
        <h2 style="margin:0 0 20px 0;">Register</h2>

        <label><strong>Username</strong></label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label><strong>Password</strong></label>
        <input type="password" name="password" placeholder="Create a password" required>

        
        <label><strong>Roll Number</strong></label>
        <input type="text" name="roll_number" placeholder="Enter roll number" required>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top:12px; font-size:0.9rem; color:#aaa;">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</div>

{% endblock %}
