{% extends 'base.html' %}
{% block content %}

<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh;">
    <form class="auth-form" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h2 style="margin:0 0 20px 0;">Create Event</h2>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <label>Event Title</label>
        <input type="text" name="title" placeholder="e.g. Professor will be late" required>

        <label>Description</label>
        <textarea name="description" placeholder="e.g. Between Monday and Wednesday" rows="3" required></textarea>

        <label>Event Type</label>
        <select name="event_type" style="
            background: #1a1810;
            border: 1px solid #3d2e1e;
            color: #e8dfc8;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 14px;
            box-sizing: border-box;
            color-scheme: dark;
        ">
            <option value="standard">Standard (YES / NO)</option>
            <option value="most_likely_to">Most Likely To</option>
        </select>

        <button type="submit">Create Event</button>
    </form>
</div>

{% endblock %}
