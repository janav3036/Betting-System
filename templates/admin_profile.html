{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2>{{ current_user.username }}</h2>
    <p>Roll Number: <strong>{{ current_user.roll_number }}</strong></p>
    <p>Role: <strong>Admin</strong></p>
    <div style="margin-top: 16px;">
        <a href="{{ url_for('admin.create_event') }}" class="nav-link">Create Event →</a><br><br>
        <a href="{{ url_for('admin.admin_groups') }}" class="nav-link">Manage Groups →</a><br><br>
        <a href="{{ url_for('admin.download_db') }}" class="nav-link">Download Database →</a>
    </div>
    <div class="danger-zone">
        <form action="/delete_account" method="POST" onsubmit="return confirm('Permanently delete your account? This cannot be undone.');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" style="background:#8b3020; color:#e8dfc8; padding:8px 16px; border-radius:5px;">Delete Account</button>
        </form>
    </div>

</div>
{% endblock %}
